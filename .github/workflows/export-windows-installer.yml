name: Export Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest

    steps:
      - name: Download sealed v1.0.1 installer
        shell: pwsh
        run: |
          $url = "https://github.com/cxm0629/starlight-letters/releases/download/v1.0.1/Setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "Setup.exe"

      - name: Verify installer
        shell: pwsh
        run: |
          $expectedSize = 122376703
          $expectedHash = "F014A5F4DCC3AD324CDADDF203071AF27CDD295A19D5662FB767B51C01822283"

          $file = Get-Item "Setup.exe"
          $actualHash = (Get-FileHash "Setup.exe" -Algorithm SHA256).Hash

          Write-Host "Size: $($file.Length)"
          Write-Host "SHA-256: $actualHash"

          if ($file.Length -ne $expectedSize) {
            throw "Installer size mismatch."
          }

          if ($actualHash -ne $expectedHash) {
            throw "Installer SHA-256 mismatch."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: starlight-letters-windows-v1.0.1
          path: Setup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
